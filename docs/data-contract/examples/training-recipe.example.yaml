example_only: true
runnable: false
contract_version: v0.1
# This is a data recipe; sampling belongs to a separate training plan.
storage_layout: indexed_references
selection:
  manifest_path: null
  manifest_sha256: null
bindings: [] # Per binding: pinned codec build branch/version and speaker or online-audio references.
text_normalization: unicode-strip-v1
language_aliases: {en-US: en, zh-CN: zh}
codec_profile_id: null
text_tokenizer_profile_id: null
speaker_feature_profile_id: null
speaker_conditioning_mode: frozen_embedding
speaker_frontend_profile: null
speaker_encoder_trainable: false
reference_policy: self
reference_scope: target
require_reference_codec: false
reference_pairing:
  require_confirmed_same_speaker: false
  allow_same_segment: true
  allow_time_overlap: true
  reference_count: 1
model_protocol:
  conditioning: speaker_only
  uses_speaker_conditioning: true
  requires_reference_text: false
  version: null
  maximum_context: null
  padding_and_loss_mask: null
